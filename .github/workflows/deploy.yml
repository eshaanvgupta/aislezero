name: Verify, package and optionally deploy AisleZero
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build configured production artifact
        run: npm run build
        env:
          VITE_ISSUER_URL: ${{ vars.VITE_ISSUER_URL }}
          VITE_TRUSTED_ISSUERS: ${{ vars.VITE_TRUSTED_ISSUERS }}
          VITE_OPERATOR_PUBKEY: ${{ vars.VITE_OPERATOR_PUBKEY }}
          VITE_PAYMENTS_ENABLED: ${{ vars.VITE_PAYMENTS_ENABLED || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: aislezero-static-build
          path: dist
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: aislezero-static-build
          path: dist
      - run: npx wrangler pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
        env:
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
